name: Monthly alerts and executive report

# Se ejecuta el dia 1 de cada mes a las 05:00 UTC (06:00 hora peninsular en
# invierno, 07:00 en verano). En esa ventana la DGT ya ha publicado los
# microdatos del mes anterior y la pipeline R local los ha consolidado.
#
# Tambien permite ejecucion manual desde la pestana Actions de GitHub
# (workflow_dispatch) para pruebas o reenvios puntuales.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      run_alerts:
        description: "Ejecutar alert_engine.py"
        required: false
        default: "true"
      run_monthly:
        description: "Ejecutar monthly_report.py"
        required: false
        default: "true"

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MatriX/scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MatriX/scripts/requirements.txt

      - name: Run alert engine
        if: ${{ github.event_name == 'schedule' || inputs.run_alerts == 'true' }}
        env:
          # Credenciales -- definir como Secrets del repo en
          # Settings -> Secrets and variables -> Actions.
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_SENDER: ${{ secrets.ALERT_SENDER }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          cd MatriX
          python scripts/alert_engine.py

      - name: Run monthly executive report
        if: ${{ github.event_name == 'schedule' || inputs.run_monthly == 'true' }}
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_SENDER: ${{ secrets.REPORT_SENDER }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          cd MatriX
          python scripts/monthly_report.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-logs-${{ github.run_id }}
          path: |
            MatriX/scripts/alert_log.txt
            MatriX/scripts/monthly_report_log.txt
          if-no-files-found: warn
          retention-days: 30
